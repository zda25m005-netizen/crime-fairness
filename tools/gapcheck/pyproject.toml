[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapcheck"
version = "0.1.0"
description = "Is that reported group gap real, or is it arithmetic? Base-rate and pooling diagnostics for fairness evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fairness", "evaluation", "auc", "base rate", "metrics", "audit"]
dependencies = ["numpy>=1.20"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gapcheck = "gapcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
